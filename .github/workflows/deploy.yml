name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

# Permisos necesarios para despliegue directo a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que múltiples despliegues choquen entre sí
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build

      # Paso 1: Subir los archivos compilados como un artefacto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Asegúrate de que 'dist' sea la carpeta donde se genera tu build
          path: dist

      # Paso 2: Desplegar el artefacto directamente a GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4